<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/vnd.microsoft.icon" href="/IMOSfavicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMOS Live</title>
    <meta
      name="description"
      content="IMOS Live is an interactive marine data visualisation platform built for Australia's Integrated Marine Observing System. It combines multiple ocean datasets on an interactive Mapbox map, allowing users to explore and analyse current conditions across the Australasian region."
    />
    <meta name="keywords" content="AODN, IMOS, imos live, interactive marine data visualisation" />
    <meta name="author" content="AODN IMOS" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IMOS Live" />
    <meta property="og:title" content="IMOS Live" />
    <meta property="og:description" content="IMOS Live is an interactive marine data visualisation platform built for Australia's Integrated Marine Observing System." />
    <meta property="og:url" content="<%- url %>" />
    <meta property="og:image" content="<%- ogImage %>" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="<%- twitterHandle %>" />
    <meta name="twitter:title" content="IMOS Live" />
    <meta name="twitter:description" content="IMOS Live is an interactive marine data visualisation platform built for Australia's Integrated Marine Observing System." />
    <meta name="twitter:image" content="<%- ogImage %>" />

    <!-- Theme and browser configuration -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- google-analytics-js -->

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "IMOS Live",
        "url": "<%- url %>",
        "description": "IMOS Live is an interactive marine data visualisation platform built for Australia's Integrated Marine Observing System."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
